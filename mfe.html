<html>
    <head>
        <style>
            body {
                font-size: 18px;
                margin: 0px;
            }

            ul {
                list-style-type: none;
                padding-left: 0px;
            }

            #nav-bar {
                height: 50px;
                width: 100%;
                background-color: #CCC;
                display: flex;
                align-items: center;
                padding: 10px;
                box-sizing: border-box;
                margin-bottom: 10px;
            }

            #header {
                padding: 10px;
                display: flex;
                align-items: center;
                font-size: 18px;
                height: 40px;
                background-color: #CCC;
            }

            #app-content {
                margin: 0px;
                padding: 0px;
            }

            #content {
                padding: 10px;
                height: calc(100vh - 60px);
            }

            #left-nav-bar {
                width: 200px;
                height: calc(100vh - 60px);
                background-color: #CCC;
                padding: 10px;
                box-sizing: border-box;
            }

            #second-row {
                display: flex;
            }

            .nav-section {
                padding-bottom: 10px;
            }

            .nav-item {
                cursor: pointer;
                margin-left: 10px;
            }

            .nav-item:hover {
                text-decoration: underline;
            }

            #app-content {
                margin-left: 10px;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <div id="shell-container">
            <div id="header">
                The app header
            </div>
            <div id="second-row">
                <div id="left-nav-bar">
                    <div class="title">Left Nav</div>
                    <ul>
                        <li class="nav-section">
                            <a href="#products">
                                Products
                            </a>
                        </li>
                        <li class="nav-section">
                            <a href="#services"">
                                Services
                            </a>
                        </li>
                        <li class="nav-section">
                            <a href="#support">
                                Support
                            </a>
                        </li>
                    </ul>
                </div>
                <div id="app-content"></div>
            </div>
        </div>

        <template id="app-template">
            <div class="heading">
                You're currently viewing {{ topLevelApp }}
            </div>
            <div>
                <button class="some-button-1">Button 1</button>
                <button class="some-button-2">Button 2</button>
                <button class="some-button-3">Button 3</button>
            </div>
        </template>

        <script>
            const templateStringRegex = /{{\s*([a-zA-Z0-9_]+)\s*}}/g;
            const routeInternals = {};
            const visitorId = window.location.search.split('visitorId=')[1] || 'test-visitor';
            let currentApp;

            const apps = {
                'App-1': {
                    name: 'Products',
                    regex: /^products/,
                    apiKey: 'ccb72ea6-f28c-431d-8e47-cb0de67cef4b'
                },
                'App-2': {
                    name: 'Services',
                    regex: /^services/,
                    apiKey: '158a2802-9f34-412e-a70e-37b4f52af77a'
                },
                'App-3': {
                    name: 'Support',
                    regex: /^support/,
                    apiKey: 'a681e018-f0b3-4763-966b-08a1b5439a17'
                },
            };

            const fallbackApp = {
                name: 'Home (Fallback)',
                apiKey: '90ec9a8b-a535-4872-9779-1bd7fa168587',
            }

            initializePendo(determineCurrentApp());
            renderRoute();

            window.addEventListener('hashchange', () => {
                initializePendo(determineCurrentApp());
                renderRoute();
            });

            function determineCurrentApp() {
                const appKey = Object.keys(apps).find(appName => {
                    const app = apps[appName];

                    return app.regex.test(window.location.hash.replace(/^#\/?/, ''));
                });

                const app = apps[appKey];

                console.log("?", app)

                if(!app) {
                    console.warn('Fell back to fallback app :(')
                    return fallbackApp
                }

                return app;
            }

            function initializePendo(app) {
                if(currentApp === app) return;

                currentApp = app;
                const apiKey = app.apiKey;

                const accountId = 'some-account'

                const options = {
                    visitor: {
                        id: visitorId
                    },
                    account: {
                        id: accountId
                    }
                };

                console.log("switching to api key", apiKey);

                return new Promise(function (resolve) {
                    const id = `pendo-agent-${apiKey}`;
                    if (window.pendo && window.pendo.teardown) {
                        window.pendo.teardown();
                        delete window.pendo;
                    }

                    let script = document.getElementById(id);
                    if (script) {
                        window.pendo = window[id];
                        window.pendo.initialize(options);
                        resolve();
                    } else {
                        script = document.createElement('script');
                        script.id = id;
                        script.onload = function () {
                            window[id] = window.pendo;
                            window.pendo.initialize(options);
                            resolve();
                        };
                        script.src = 'https://cdn.pendo-link.pendo-dev.com/agent/static/' + apiKey + '/pendo.js';
                        document.head.appendChild(script);
                    }
                });
            }

            function renderRoute() {
                const template = document.getElementById('app-template');
                const clone = template.content.cloneNode(true);

                const wrapper = document.createElement('div');
                wrapper.id = 'content'
                wrapper.appendChild(clone);

                const context = { topLevelApp: currentApp.name };
                wrapper.innerHTML = wrapper.innerHTML.replace(templateStringRegex, (_, key) => context[key] ?? '');

                const appContent = document.getElementById('app-content');
                appContent.innerHTML = '';

                console.log("?", wrapper)
                appContent.appendChild(wrapper);
            }
        </script>
    </body>
</html>
